name: Rojo Build & Luau Static Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  ROKIT_VERSION: "1.2.0"

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rokit and project tools (rokit.toml)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSL -o rokit.zip "https://github.com/rojo-rbx/rokit/releases/download/v${ROKIT_VERSION}/rokit-${ROKIT_VERSION}-linux-x86_64.zip"
          unzip -o rokit.zip -d "$HOME/.rokit-dl"
          "$HOME/.rokit-dl/rokit" self-install
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          "$HOME/.rokit/bin/rokit" install --no-trust-check

      - name: Format (StyLua)
        run: stylua --check src tests

      - name: Lint (Selene)
        run: selene src

      - name: Type check (luau-lsp, strict)
        run: |
          curl -sSL -o globalTypes.d.luau "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau"
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --sourcemap=sourcemap.json --definitions=globalTypes.d.luau --platform=roblox --settings=.vscode/settings.json src

      - name: Tests (Lune)
        run: lune run tests/run.luau

      - name: Verify Rojo Project
        run: rojo build default.project.json --output RobloxenviromentLKM.rbxl

      - name: Upload place file
        uses: actions/upload-artifact@v4
        with:
          name: RobloxenviromentLKM-place
          path: RobloxenviromentLKM.rbxl
